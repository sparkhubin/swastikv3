<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circle clip path -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>
  </defs>

  <!-- Outer Ring and Dark Background -->
  <circle cx="250" cy="250" r="245" fill="#080808" stroke="#ffffff" stroke-width="4" />
  <circle cx="250" cy="250" r="238" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Content Container inside circle -->
  <g clip-path="url(#circleClip)">
    <!-- Sun Rays on Top-Left of 'S' -->
    <g transform="translate(75, 145)">
      <circle cx="25" cy="25" r="12" fill="#FFCC00" />
      <line x1="25" y1="-2" x2="25" y2="6" stroke="#FFCC00" stroke-width="4.5" stroke-linecap="round" />
      <line x1="6" y1="6" x2="12" y2="12" stroke="#FFCC00" stroke-width="4.5" stroke-linecap="round" />
      <line x1="-2" y1="25" x2="6" y2="25" stroke="#FFCC00" stroke-width="4.5" stroke-linecap="round" />
      <line x1="6" y1="44" x2="12" y2="38" stroke="#FFCC00" stroke-width="4.5" stroke-linecap="round" />
      <line x1="44" y1="6" x2="38" y2="12" stroke="#FFCC00" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Main Text "Swastik" -->
    <!-- Stylized 'S' with integrated shopping cart handle -->
    <text x="65" y="255" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-2">Swastik</text>

    <!-- Swastika Symbol above 'i' -->
    <g transform="translate(382, 182) scale(0.65)">
      <path d="M 12,0 V 24 H 24 V 12 H 36 V 24 H 24 V 36 H 36 M 24,24 H 0 V 36 H 12 V 48 H 0 V 36 H 12 V 24 H 0 M 12,12 H 0 V 0 H 12 M 24,0 H 36 V 12 H 24" fill="none" />
      <!-- Clean vector swastika symbol in gold -->
      <path d="M12,2 L12,12 L2,12 M12,12 L12,22 L22,22 M12,12 L22,12 L22,2 M12,12 L2,12 L2,22" stroke="#FFCC00" stroke-width="4" stroke-linecap="square" fill="none" />
    </g>

    <!-- Shopping Cart Handle and Wheels under Swastik -->
    <path d="M 145,268 L 225,268 L 255,230 L 280,230" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cart Wheels -->
    <circle cx="168" cy="292" r="9" fill="#FFCC00" />
    <circle cx="202" cy="292" r="9" fill="#FFCC00" />

    <!-- "Super Market" Text -->
    <text x="242" y="292" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="0">Super Market</text>

    <!-- Horizontal White Line -->
    <line x1="70" y1="310" x2="430" y2="310" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Tagline "Aapka Apna Bazaar" in Orange -->
    <text x="250" y="342" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="28" fill="#FF5722" text-anchor="middle" letter-spacing="3">Aapka Apna Bazaar</text>
  </g>
</svg>
